# Development infrastructure: PostgreSQL with pgvector, and Redis. Ports are unusual on purpose, so they
# never clash with other local databases (and sit below the Windows dynamic range, which Hyper-V reserves). The full stack (API, worker, console, portal, bot) is in
# deploy/compose.yaml.
name: clearhire-dev

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_USER: clearhire
      POSTGRES_PASSWORD: clearhire
      POSTGRES_DB: clearhire
    ports:
      - "127.0.0.1:25432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearhire -d clearhire"]
      interval: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:26379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

volumes:
  postgres:
