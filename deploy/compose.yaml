# The whole of Clearhire on one Docker host:
#   cp deploy/.env.example deploy/.env   # then fill it in
#   docker compose -f deploy/compose.yaml --env-file deploy/.env up -d --build
#
# Only Caddy publishes ports. Every container opts out of Watchtower: this host may run other people's
# services with auto-updates, and a database must never be upgraded underneath us.
name: clearhire

x-labels: &labels
  com.centurylinklabs.watchtower.enable: "false"
  app: clearhire

x-backend: &backend
  image: clearhire-api:${CLEARHIRE_VERSION:-latest}
  build:
    context: ..
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  labels: *labels
  environment:
    CLEARHIRE_DATABASE_URL: postgresql+asyncpg://clearhire:${POSTGRES_PASSWORD:?}@postgres:5432/clearhire
    CLEARHIRE_REDIS_URL: redis://redis:6379/0
    CLEARHIRE_JWT_SECRET: ${JWT_SECRET:?}
    CLEARHIRE_CORS_ORIGINS: '["https://${CONSOLE_HOST}","https://${CAREERS_HOST}"]'
    CLEARHIRE_DEMO_READ_ONLY: ${DEMO_READ_ONLY:-false}
    CLEARHIRE_RETENTION_DAYS: ${RETENTION_DAYS:-365}
    # any OpenAI-compatible chat endpoint; empty turns the AI assistant off
    CLEARHIRE_LLM_URL: ${LLM_URL-http://llm:11434/v1}
    CLEARHIRE_LLM_MODEL: ${LLM_MODEL:-qwen3.5:9b}
    CLEARHIRE_LLM_API_KEY: ${LLM_API_KEY:-}
    CLEARHIRE_BOT_SECRET: ${BOT_SECRET:-}
  volumes:
    - files:/data/files
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    migrate: { condition: service_completed_successfully }
  networks: [internal]

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg17
    restart: unless-stopped
    labels: *labels
    environment:
      POSTGRES_USER: clearhire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: clearhire
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearhire -d clearhire"]
      interval: 5s
      retries: 20
    shm_size: 256mb
    networks: [internal]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    labels: *labels
    # append-only persistence: the job queue and the bot's chat-to-application links survive restarts
    command: ["redis-server", "--save", "", "--appendonly", "yes", "--maxmemory", "256mb"]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
    networks: [internal]

  # The local LLM on the GPU (Ollama through Vulkan, see deploy/llm/Dockerfile). Nothing leaves the
  # server: CV text never goes to a third-party API.
  # First start: docker compose ... exec llm ollama pull qwen3.5:9b
  llm:
    image: clearhire-llm:${CLEARHIRE_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/llm/Dockerfile
    restart: unless-stopped
    labels: *labels
    environment:
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_NUM_PARALLEL: "2"
    volumes:
      - llm:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [internal]

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/health', timeout=4)"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    deploy:
      resources:
        limits: { memory: 3g }

  worker:
    <<: *backend
    command: ["taskiq", "worker", "clearhire.tasks:broker", "--workers", "1"]
    deploy:
      resources:
        limits: { memory: 3g }

  portal:
    image: clearhire-portal:${CLEARHIRE_VERSION:-latest}
    build:
      context: ..
      dockerfile: portal/Dockerfile
    restart: unless-stopped
    labels: *labels
    environment:
      CLEARHIRE_API_URL: http://api:8000
      CLEARHIRE_PUBLIC_URL: https://${CAREERS_HOST}
      CLEARHIRE_RETENTION_DAYS: ${RETENTION_DAYS:-365}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  # The Telegram bot: on with COMPOSE_PROFILES=telegram and a token from @BotFather in deploy/.env.
  # It long-polls Telegram, so it needs no public port.
  bot:
    image: clearhire-bot:${CLEARHIRE_VERSION:-latest}
    build:
      context: ..
      dockerfile: bot/Dockerfile
    profiles: [telegram]
    restart: unless-stopped
    labels: *labels
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      CLEARHIRE_API_URL: http://api:8000
      CLEARHIRE_BOT_SECRET: ${BOT_SECRET:-}
      REDIS_URL: redis://redis:6379/0
      CAREERS_URL: https://${CAREERS_HOST}
      CONSOLE_URL: https://${CONSOLE_HOST}
      RECRUITER_CHAT_IDS: ${RECRUITER_CHAT_IDS:-}
    depends_on:
      api: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  caddy:
    image: clearhire-caddy:${CLEARHIRE_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/caddy/Dockerfile
    restart: unless-stopped
    labels: *labels
    environment:
      CAREERS_HOST: ${CAREERS_HOST:?}
      CONSOLE_HOST: ${CONSOLE_HOST:?}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api, portal]
    networks: [internal]

volumes:
  postgres:
  files:
  llm:
  redis:
  caddy_data:
  caddy_config:

networks:
  internal:
