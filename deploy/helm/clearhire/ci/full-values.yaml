# Everything switched on, for rendering and schema checks only (it needs a GPU node and a bot token).
hosts:
  careers: careers.example.com
  console: console.example.com
secrets:
  jwtSecret: "a-test-secret-that-is-long-enough-1234567890"
  telegramBotToken: "123456:test-token-for-rendering-only"
  anchorPrivateKey: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
bot:
  enabled: true
  recruiterChatIds: "12345, -100987"
llm:
  enabled: true
  nodeSelector: { nvidia.com/gpu.present: "true" }
  tolerations: [{ key: nvidia.com/gpu, operator: Exists, effect: NoSchedule }]
anchoring:
  enabled: true
  rpcUrl: https://sepolia.base.org
  chainName: Base Sepolia
  explorerTxUrl: https://sepolia.basescan.org/tx/
  contract: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
seed:
  enabled: true
files:
  accessMode: ReadWriteMany
  storageClass: nfs
gateway:
  enabled: true
  create: true
  className: cilium
  listeners: { http: true, httpsSecretName: clearhire-tls }
ingress:
  enabled: true
  className: traefik
  tlsSecretName: clearhire-tls
networkPolicy:
  enabled: true
  gatewayNamespace: kube-system
  metricsNamespace: monitoring
serviceMonitor:
  enabled: true
