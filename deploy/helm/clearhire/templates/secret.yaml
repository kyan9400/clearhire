{{- if not .Values.secrets.existingSecret }}
{{- $name := include "clearhire.secretName" . }}
{{- $fullname := include "clearhire.fullname" . }}
{{- /* generated once, then read back on every upgrade so passwords and signing keys never change */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
{{- $pg := .Values.postgres.password | default (get $old "postgres-password" | b64dec) | default (randAlphaNum 32) }}
{{- $redis := .Values.redis.password | default (get $old "redis-password" | b64dec) | default (randAlphaNum 32) }}
{{- $jwt := .Values.secrets.jwtSecret | default (get $old "jwt-secret" | b64dec) | default (randAlphaNum 48) }}
{{- $bot := .Values.secrets.botSecret | default (get $old "bot-secret" | b64dec) | default (randAlphaNum 40) }}
{{- $databaseUrl := .Values.postgres.externalUrl }}
{{- if .Values.postgres.enabled }}
{{- $databaseUrl = printf "postgresql+asyncpg://clearhire:%s@%s-postgres:5432/clearhire" $pg $fullname }}
{{- end }}
{{- $redisUrl := .Values.redis.externalUrl }}
{{- if .Values.redis.enabled }}
{{- $redisUrl = printf "redis://:%s@%s-redis:6379/0" $redis $fullname }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "clearhire.labels" (dict "ctx" . "component" "secrets") | nindent 4 }}
type: Opaque
stringData:
  postgres-password: {{ $pg | quote }}
  database-url: {{ required "postgres.externalUrl is required when postgres.enabled is false" $databaseUrl | quote }}
  redis-password: {{ $redis | quote }}
  redis-url: {{ required "redis.externalUrl is required when redis.enabled is false" $redisUrl | quote }}
  jwt-secret: {{ $jwt | quote }}
  bot-secret: {{ $bot | quote }}
  {{- with .Values.secrets.telegramBotToken }}
  telegram-bot-token: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.llmApiKey }}
  llm-api-key: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.anchorPrivateKey }}
  anchor-private-key: {{ . | quote }}
  {{- end }}
{{- end }}
