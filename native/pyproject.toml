[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "clearhire-native"
version = "0.1.0"
description = "C++ Aho-Corasick skill matcher for Clearhire (optional: Clearhire falls back to pure Python)"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alhassan Alfarran" }]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []
