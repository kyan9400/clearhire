name: bot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["bot/**", "api/openapi.json", ".github/workflows/bot.yml"]
  pull_request:
    paths: ["bot/**", "api/openapi.json", ".github/workflows/bot.yml"]

permissions:
  contents: read

concurrency:
  group: bot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: bot

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bot/package-lock.json
      - run: npm ci
      - name: API types match api/openapi.json
        run: npm run api:types && git diff --exit-code -- src/api/schema.d.ts
      - run: npm run format:check
      - run: npm run typecheck
      - name: Tests, including the Redis store and the event stream
        run: npm test
        env:
          REDIS_TEST_URL: redis://localhost:6379/15
      - run: npm run build
