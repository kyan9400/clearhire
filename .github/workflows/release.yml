name: release

# A version tag (v0.1.0) publishes the images to GitHub Container Registry and the Helm chart as an OCI
# artifact next to them:
#   helm install clearhire oci://ghcr.io/kyan9400/charts/clearhire --version 0.1.0
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  images:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: api, file: backend/Dockerfile }
          - { name: portal, file: portal/Dockerfile }
          - { name: console, file: console/Dockerfile }
          - { name: bot, file: bot/Dockerfile }
          - { name: llm, file: deploy/llm/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - name: Make room
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: The version, without the v (the chart's default image tag is its appVersion)
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.file }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/clearhire-${{ matrix.name }}:${{ steps.version.outputs.version }}
            ${{ env.REGISTRY }}/clearhire-${{ matrix.name }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  chart:
    needs: images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0
      - name: The tag, the chart version and the app version agree
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -qx "version: $version" deploy/helm/clearhire/Chart.yaml
          grep -qx "appVersion: \"$version\"" deploy/helm/clearhire/Chart.yaml
      - name: Package and push
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/clearhire -d /tmp/chart
          helm push /tmp/chart/clearhire-*.tgz "oci://$REGISTRY/charts"
