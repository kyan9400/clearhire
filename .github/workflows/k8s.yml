name: kubernetes

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: k8s-${{ github.ref }}
  cancel-in-progress: true

env:
  HELM_VERSION: v4.3.0
  KIND_VERSION: v0.33.0
  KUBECTL_VERSION: v1.36.4
  KUBECONFORM_VERSION: v0.8.0

jobs:
  chart:
    name: lint and validate the chart
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: kubeconform
        run: |
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
      - name: Lint with every value set
        working-directory: deploy/helm
        run: |
          helm lint --strict clearhire
          for values in clearhire/ci/*-values.yaml; do helm lint --strict clearhire -f "$values"; done
      - name: Render and validate against Kubernetes 1.34 to 1.36 (CRDs from the datree catalog)
        working-directory: deploy/helm
        run: |
          for values in "" clearhire/ci/*-values.yaml; do
            for version in 1.34.0 1.35.0 1.36.0; do
              echo "== ${values:-default values} on $version"
              helm template clearhire clearhire -n clearhire ${values:+-f "$values"} --kube-version "$version" \
                | kubeconform -strict -summary -kubernetes-version "$version" \
                    -schema-location default \
                    -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            done
          done
      - name: Values the schema must refuse
        working-directory: deploy/helm
        run: |
          refuse() { if helm template t clearhire "$@" >/dev/null 2>&1; then echo "accepted: $*"; exit 1; fi; }
          refuse --set secrets.jwtSecret=short
          refuse --set hosts.scheme=ftp
          refuse --set anchoring.contract=0x123
          refuse --set postgres.enabled=false
          refuse --set bot.enabled=true
          refuse --set anchoring.enabled=true
          refuse --set gateway.enabled=true
          refuse --set unknownKey=1
          echo "all refused"

  e2e:
    name: end to end on kind
    needs: chart
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Make room (the API image carries PyTorch and an embedding model)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          df -h /
      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: kind and kubectl
        run: |
          curl -sSfLo kind "https://github.com/kubernetes-sigs/kind/releases/download/$KIND_VERSION/kind-linux-amd64"
          curl -sSfLo kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          sudo install kind kubectl /usr/local/bin/ && rm kind kubectl
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build the API image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: backend/Dockerfile
          tags: clearhire-api:ci
          load: true
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build the portal image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: portal/Dockerfile
          tags: clearhire-portal:ci
          load: true
          cache-from: type=gha,scope=portal
          cache-to: type=gha,scope=portal,mode=max
      - name: Build the console image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: console/Dockerfile
          tags: clearhire-console:ci
          load: true
          cache-from: type=gha,scope=console
          cache-to: type=gha,scope=console,mode=max
      - name: Install, seed, route, anchor, test, upgrade under load
        run: bash deploy/helm/e2e.sh
