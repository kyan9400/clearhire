name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "native/**", "api/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", "native/**", "api/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy
      - name: api/openapi.json matches the code
        run: clearhire openapi --out - | diff - ../api/openapi.json

  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_USER: clearhire
          POSTGRES_PASSWORD: clearhire
          POSTGRES_DB: clearhire_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clearhire"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CLEARHIRE_TEST_DATABASE_URL: postgresql+asyncpg://clearhire:clearhire@localhost:5432/clearhire_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Tesseract (Russian + English)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-rus
      - name: Install
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -e ".[dev]"
      - name: Build the C++ matcher
        run: pip install ../native
      - name: Migrations go up, down and up again
        env:
          CLEARHIRE_DATABASE_URL: postgresql+asyncpg://clearhire:clearhire@localhost:5432/clearhire_test
        run: alembic upgrade head && alembic downgrade base && alembic upgrade head && alembic downgrade base
      - name: Tests (including native parity and OCR)
        run: pytest -q
      - name: Matcher benchmark
        run: python scripts/bench_matcher.py
