# The console's static build. nginx drops a parent's add_header in any location that sets its own, so
# every location includes the same security headers.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # hashed file names: cache for a year
    location ~* \.(?:js|css|woff2|svg|png|ico)$ {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # client-side routes all load index.html, which is never cached so a release shows at once
    location / {
        include /etc/nginx/snippets/headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
