# Clearhire skill taxonomy: canonical skills, the words CVs and vacancies use for them, and what they imply.
#
#   id       stable identifier used everywhere else
#   name     display name
#   cat      category (language, backend, frontend, mobile, data, ml, database, devops, cloud, testing,
#            practice, tool, design, security, blockchain, management)
#   aka      aliases, matched case-insensitively on whole words ("ё" = "е"); a trailing "*" matches any
#            word that starts with the alias, for Russian word forms ("докер*" matches "докере")
#   strict   ambiguous aliases ("Go", "R", "REST") that only count as written, inside a list: between
#            line starts or ends, commas, semicolons, slashes, pipes, bullets or brackets
#   implies  skills a person with this skill also has (FastAPI implies Python)
