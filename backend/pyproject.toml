[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "clearhire"
version = "0.1.0"
description = "Explainable AI recruiting: CV parsing with OCR, requirement-level matching with evidence, fairness checks and a tamper-evident audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Alhassan Alfarran" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "taskiq>=0.11",
  "taskiq-redis>=1.0",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "pillow>=10.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "prometheus-client>=0.20",
  "sentence-transformers>=3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "faker>=26",
  "reportlab>=4.2",
  "fakeredis>=2.23",
  "types-PyYAML",
  "pandas-stubs",
]

[project.scripts]
clearhire = "clearhire.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clearhire"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
  "postgres: needs a PostgreSQL server with pgvector (CLEARHIRE_TEST_DATABASE_URL)",
  "ocr: needs the Tesseract binary",
  "model: downloads or loads the multilingual embedding model",
]
filterwarnings = ["ignore::DeprecationWarning:pypdfium2"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT", "ASYNC", "S"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # Cyrillic and typographic characters are intended
  "S101",                        # assert is used in tests and for invariants
  "SIM905",                      # word lists read better as """...""".split()
  "E501",                        # the formatter owns line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PT011", "PT018"]
"src/clearhire/synth/**" = ["S311"]  # the synthetic data generator uses a seeded random.Random on purpose
"src/clearhire/services/seed.py" = ["S311"]  # demo data, seeded on purpose

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*", "docx.*", "sentence_transformers.*", "taskiq_redis.*", "pgvector.*", "reportlab.*", "faker.*", "clearhire_native"]
ignore_missing_imports = true
